[package]
name = "nier_online"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Peer-to-peer two-player co-op for NieR:Automata"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytes = "1"
bytemuck = { version = "1.25", features = ["derive"] }
crossbeam-queue = "0.3.14"
data-encoding = "2.11"
iced-x86 = { version = "1.22", default-features = false, features = ["std", "decoder"] }
ilhook = "2.3"
iroh = "1.5"
postcard = { version = "1.2", features = ["use-std"] }
retour = "0.3"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.54", features = ["rt", "time", "sync", "macros"] }
toml = "1.2"
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
hudhook = { version = "0.9.3", default-features = false, features = ["dx11"] }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
]

[profile.release]
debug = "line-tables-only"
panic = "abort"
